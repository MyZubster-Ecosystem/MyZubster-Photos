name: Migrate existing GitHub photos

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Run sanitized GitHub photo migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout photo repository
        uses: actions/checkout@v4
        with:
          path: photos-repo

      - name: Checkout MyZubster core
        uses: actions/checkout@v4
        with:
          repository: MyZubster-Ecosystem/myzubster
          ref: main
          path: source-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image sanitizer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Migrate sanitized public photos
        run: |
          python photos-repo/scripts/migrate-github-public-photos.py \
            --source source-repo/public/media/rimini \
            --repo photos-repo

      - name: Validate migration manifest
        working-directory: photos-repo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('metadata/github-core-migration.json')
          data = json.loads(p.read_text())
          assert data['count'] > 0, 'No photos migrated'
          assert data['count'] == len(data['photos'])
          assert all(x['privacy']['exifStripped'] for x in data['photos'])
          print(f"Validated {data['count']} migrated photos")
          PY

      - name: Commit migration
        working-directory: photos-repo
        run: |
          if git diff --quiet -- photos metadata/github-core-migration.json; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photos metadata/github-core-migration.json
          git commit -m 'feat: migrate sanitized public photos from core'
          git push origin HEAD:main
