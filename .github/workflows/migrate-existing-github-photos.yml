name: Migrate existing GitHub photos

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.title == 'Migrate existing GitHub photos'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
    steps:
      - name: Checkout photo repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: photos-repo

      - name: Check whether migration is already present
        id: migration_state
        working-directory: photos-repo
        run: |
          if [ -f metadata/github-core-migration.json ]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'Migration manifest already present; no new migration commit needed.'
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout MyZubster core
        if: steps.migration_state.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          repository: MyZubster-Ecosystem/myzubster
          ref: main
          path: source-repo

      - name: Set up Python
        if: steps.migration_state.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image sanitizer
        if: steps.migration_state.outputs.needed == 'true'
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Migrate sanitized public photos
        if: steps.migration_state.outputs.needed == 'true'
        run: |
          python photos-repo/scripts/migrate-github-public-photos.py \
            --source source-repo/public/media/rimini \
            --repo photos-repo

      - name: Validate migration manifest
        if: steps.migration_state.outputs.needed == 'true'
        working-directory: photos-repo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('metadata/github-core-migration.json')
          data = json.loads(p.read_text())
          assert data['count'] > 0, 'No photos migrated'
          assert data['count'] == len(data['photos'])
          assert all(x['privacy']['exifStripped'] for x in data['photos'])
          print(f"Validated {data['count']} migrated photos")
          PY

      - name: Commit migration to target branch
        if: steps.migration_state.outputs.needed == 'true'
        working-directory: photos-repo
        run: |
          if [ -z "$(git status --porcelain -- photos metadata/github-core-migration.json)" ]; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photos metadata/github-core-migration.json
          git commit -m 'feat: migrate sanitized public photos from core'
          git push origin "HEAD:${TARGET_BRANCH}"
